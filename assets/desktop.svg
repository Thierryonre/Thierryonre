#9ee9ce" font-weight="500" class="mono">thierry@workshop</text><text x="214" y="94" font-size="18" fill="#a8b0c3" font-weight="400" class="mono">~ %</text><g class="typed"><text x="28" y="134" font-size="24" fill="#f0eee8" font-weight="500" class="mono">python originStory.py</text></g><g class="output-one"><text x="28" y="186" font-size="18" fill="#f2ba85" font-weight="500" class="mono">[spark]</text><text x="130" y="186" font-size="20" fill="#dbe1ed" font-weight="400" class="mono">Watched Iron Man.</text></g><g class="output-two"><text x="28" y="221" font-size="18" fill="#a0e4d1" font-weight="500" class="mono">[quest]</text><text x="130" y="221" font-size="20" fill="#dbe1ed" font-weight="400" class="mono">Build my own JARVIS.</text></g><g class="output-three"><text x="28" y="268" font-size="23" fill="#fff2df" font-weight="600" class="">Still here. Still building.</text><text x="28" y="307" font-size="17" fill="#aab7c8" font-weight="400" class="">For the fun. For the challenge. For the "it actually works" moment.</text></g><rect x="365" y="115" width="12" height="23" fill="#b7f0d5" class="cursor" /></g></g><g transform="translate(786 190)"><g class="jarvis-motion"><g filter="url(#shadow)"><rect width="420" height="432" rx="18" fill="url(#panel)" /><rect x=".75" y=".75" width="418.5" height="430.5" rx="17.25" fill="none" stroke="#c6d0ef" stroke-opacity=".2" stroke-width="1.5" /></g><path d="M1 53 H419" stroke="#fff" stroke-opacity=".08" /><circle cx="25" cy="27" r="6.5" fill="#ff615b" /><circle cx="47" cy="27" r="6.5" fill="#ffbd44" /><circle cx="69" cy="27" r="6.5" fill="#00c94e" /><text x="232.0" y="33" font-size="16" fill="#b9c0d5" font-weight="500" class="" text-anchor="middle">jarvis / the long game</text><text x="210" y="92" font-size="13" fill="#90afa9" font-weight="600" class="" text-anchor="middle" letter-spacing="2">THE ORIGINAL AMBITION</text><g transform="translate(210 226) scale(1.0096153846153846)">
