<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc"><title id="title">ThierryOS</title><desc id="desc">Reduced-motion preferences disable animation</desc><defs>
  <linearGradient id="wall" x2="1" y2="1"><stop stop-color="#0d1526" /><stop offset=".48" stop-color="#252235" /><stop offset="1" stop-color="#132c38" /></linearGradient>
  <radialGradient id="ember"><stop stop-color="#f9a268" /><stop offset=".35" stop-color="#db6b62" /><stop offset=".7" stop-color="#75476a" stop-opacity=".7" /><stop offset="1" stop-color="#332743" stop-opacity="0" /></radialGradient>
  <radialGradient id="blue"><stop stop-color="#74cabd" stop-opacity=".72" /><stop offset=".45" stop-color="#418da5" stop-opacity=".5" /><stop offset="1" stop-color="#263c62" stop-opacity="0" /></radialGradient>
  <linearGradient id="ribbon" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ffcf9b" stop-opacity=".68" /><stop offset=".5" stop-color="#bd7175" stop-opacity=".32" /><stop offset="1" stop-color="#38315d" stop-opacity="0" /></linearGradient>
  <linearGradient id="panel" x2=".5" y2="1"><stop stop-color="#242737" /><stop offset="1" stop-color="#151c2b" /></linearGradient>
  <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#34445a" stop-opacity=".97" /><stop offset="1" stop-color="#142936" stop-opacity=".99" /></linearGradient>
  <radialGradient id="core"><stop stop-color="#f3fffa" /><stop offset=".32" stop-color="#afffe0" /><stop offset=".68" stop-color="#6cdbc7" stop-opacity=".34" /><stop offset="1" stop-color="#70ecd1" stop-opacity="0" /></radialGradient>
  <linearGradient id="dock" x2="0" y2="1"><stop stop-color="#e9edff" stop-opacity=".22" /><stop offset="1" stop-color="#becada" stop-opacity=".1" /></linearGradient>
  <linearGradient id="folder" x2="0" y2="1"><stop stop-color="#8bcbff" /><stop offset="1" stop-color="#528ff0" /></linearGradient>
  <filter id="shadow" x="-30%" y="-40%" width="160%" height="200%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#070b17" flood-opacity=".38" /></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" /></filter>
</defs><style>
  text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
  .mono { font-family: "SFMono-Regular",Consolas,"Liberation Mono",monospace; }
  .terminal-motion,.jarvis-motion,.projects-motion { transform-box:fill-box; transform-origin:50% 100%; }
  .terminal-motion { animation:terminal-open 18s infinite; }
  .jarvis-motion { animation:jarvis-open 18s infinite; }
  .projects-motion { animation:projects-open 18s infinite; }
  .typed { animation:typing 18s steps(22,end) infinite; }
  .output-one { animation:line-one 18s infinite; }
  .output-two { animation:line-two 18s infinite; }
  .output-three { animation:line-three 18s infinite; }
  .cursor { animation:blink 1.1s steps(1,end) infinite; }
  .spin { animation:spin 24s linear infinite; transform-origin:0px 0px; }
  .counterspin { animation:spin 36s linear reverse infinite; transform-origin:0px 0px; }
  .core-pulse { animation:breathe 4s ease-in-out infinite; }
  .notification { animation:notify 18s infinite; }
  .dock-terminal { animation:dock-bounce 18s infinite; }
  @keyframes terminal-open {
    0%,3% { opacity:0; transform:translate(163px,111px) scale(.07,.015); }
    8% { opacity:1; transform:translate(0,-7px) scale(1.025,1.035); }
    10%,86% { opacity:1; transform:translate(0,0) scale(1); }
    91%,100% { opacity:0; transform:translate(163px,111px) scale(.07,.015); }
  }
  @keyframes jarvis-open {
    0%,7% { opacity:0; transform:translate(-359.5px,71px) scale(.1,.018); }
    12% { opacity:1; transform:translate(0,-6px) scale(1.025,1.03); }
    14%,84% { opacity:1; transform:translate(0,0) scale(1); }
    89%,100% { opacity:0; transform:translate(-359.5px,71px) scale(.1,.018); }
  }
  @keyframes projects-open {
    0%,11% { opacity:0; transform:translate(150px,52px) scale(.08,.018); }
    16% { opacity:1; transform:translate(0,-5px) scale(1.018,1.035); }
    18%,82% { opacity:1; transform:translate(0,0) scale(1); }
    87%,100% { opacity:0; transform:translate(150px,52px) scale(.08,.018); }
  }
  @keyframes typing { 0%,12% {clip-path:inset(0 100% 0 0)} 23%,88% {clip-path:inset(0 0 0 0)} 91%,100% {clip-path:inset(0 100% 0 0)} }
  @keyframes line-one {0%,24%{opacity:0} 25%,88%{opacity:1} 91%,100%{opacity:0}}
  @keyframes line-two {0%,28%{opacity:0} 29%,88%{opacity:1} 91%,100%{opacity:0}}
  @keyframes line-three {0%,32%{opacity:0} 33%,88%{opacity:1} 91%,100%{opacity:0}}
  @keyframes blink {0%,55%{opacity:1} 56%,100%{opacity:0}}
  @keyframes spin {to{transform:rotate(360deg)}}
  @keyframes breathe {0%,100%{opacity:.7}50%{opacity:1}}
  @keyframes notify {0%,35%{opacity:0;transform:translateX(28px)}38%,81%{opacity:1;transform:translateX(0)}85%,100%{opacity:0;transform:translateX(28px)}}
  @keyframes dock-bounce {0%,2%,8%,100%{transform:translateY(0)}4%{transform:translateY(-14px)}6%{transform:translateY(-5px)}}
  @media (prefers-reduced-motion:reduce) {
    .terminal-motion,.jarvis-motion,.projects-motion,.typed,.output-one,.output-two,.output-three,.cursor,.spin,.counterspin,.core-pulse,.notification,.dock-terminal { animation:none !important; }
  }
</style><rect width="1280" height="760" rx="22" fill="url(#wall)" />
